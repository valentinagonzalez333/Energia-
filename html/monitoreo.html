<body>

    <div class="principal">

       <div class="cards">
    <div class="columna-izquierda">
        <div class="fila-cards">
            <div class="card">
                <h2>Potencia Actual</h2>
                <h3>0.06</h3>
                <p>kW</p>
            </div>
            <div class="card">
                <h2>Consumo Hoy</h2>
                <h3>0.002</h3>
                <p>kWh</p>
            </div>
            <div class="card">
                <h2>Factor Potencia</h2>
                <h3>0.880</h3>
            </div>
            <div class="card">
                <h2>Desviación Estandar</h2>
                <h3>0</h3>

            </div>
        </div>

      
        <div class="seccion-grafica">
            <canvas id="graficaConsumo"></canvas>
        </div>
    </div>

    <div class="cards-right">
        <div class="right">
            <h2>Promedio</h2>
            <h3>0</h3>

        </div>

        <div class="right_2">

        </div>
