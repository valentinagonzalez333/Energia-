<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas</title>
    <link rel="icon" type="image/x-icon" href="../img/Lodo-voltix.png" />
    <link rel="stylesheet" href="../css/estadisticas.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="principal">
      <img src="../img/Lodo-voltix.png" alt="" />
      <h1>Voltix</h1>
    </div>
    <button class="hamburguesa" id="hamburguesa">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="contenedor">
      <div class="menu">
        <nav>
          <ul>
            <li>
              <a href="panel.html"><i class="fa-solid fa-chart-line"></i></a>
            </li>
            <li>
              <a href="monitoreo.html"><i class="fa-solid fa-bolt"></i></a>
            </li>
            <li>
              <a href="estadisticas.html" class="activo"
                ><i class="fa-solid fa-chart-pie"></i
              ></a>
            </li>
            <li>
              <a href="dispositivos.html"><i class="fa-solid fa-plug"></i></a>
            </li>
            <li>
              <a href="usuarios.html"><i class="fa-solid fa-users"></i></a>
            </li>
            <li>
              <a href="alertas.html"
                ><i class="fa-solid fa-triangle-exclamation"></i
              ></a>
            </li>
            <li>
              <a href="login.html" id="logout" onclick="cerrarSesion()"
                ><i class="fa-solid fa-right-from-bracket"></i
              ></a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="contenido-estadisticas">
        <div class="stats-header">
          <h2>Estadísticas</h2>
          <span id="mes-actual" class="mes-label"></span>
        </div>

        <div class="resumen-cards">
          <div class="stat-card">
            <span class="stat-icono">⚡</span>
            <div>
              <p class="stat-label">Consumo del mes</p>
              <h3 id="stat-consumo">0 kWh</h3>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icono">💰</span>
            <div>
              <p class="stat-label">Costo del mes</p>
              <h3 id="stat-costo">$0</h3>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icono">🌱</span>
            <div>
              <p class="stat-label">CO₂ del mes</p>
              <h3 id="stat-co2">0 kg</h3>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icono">📊</span>
            <div>
              <p class="stat-label">Promedio diario</p>
              <h3 id="stat-promedio">0 kWh</h3>
            </div>
          </div>
        </div>

        <div class="grafica-wrap">
          <h3>Consumo últimos 7 días</h3>
          <canvas id="graficaSemana"></canvas>
        </div>
      </div>
    </div>
    <button class="boton-ia">
      <i class="fa-solid fa-robot"></i>
    </button>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="../js/estadisticas.js"></script>
  <script type="module" src="../js/chat-ai.js"></script>
</html>
