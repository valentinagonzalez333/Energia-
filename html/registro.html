<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltix – Registro</title>
    <link rel="icon" type="image/x-icon" href="../img/Lodo-voltix.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="pagina">
      <div class="panel-izquierdo">
        <img
          class="foto-casa"
          src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=900&auto=format&fit=crop&q=80"
          alt="Hogar inteligente"
        />
        <div class="degradado-inferior"></div>
        <div class="contenido-marca">
          <div class="logo">
            <div class="logo-icono">⚡</div>
            <span class="logo-nombre">Vol<span>tix</span></span>
          </div>
          <p class="frase">
            Monitorea tu energía en tiempo real. Inteligente, eficiente,
            sostenible.
          </p>
        </div>
      </div>

      <div class="panel-derecho">
        <div class="cabecera-form">
          <p class="subtitulo-form">Crea tu cuenta</p>
          <h2 class="titulo-form">Registro</h2>
        </div>

        <form action="" onsubmit="return false;">
          <div class="campo">
            <label for="usuario">Usuario</label>
            <div class="campo-icono-wrap">
              <input type="text" id="usuario" placeholder="usuario" required />
              <span class="campo-icono">👤</span>
            </div>
          </div>

          <div class="campo">
            <label for="contrasena">Contraseña</label>
            <div class="campo-icono-wrap">
              <input
                type="password"
                id="contrasena"
                placeholder="••••••••"
                required
              />
              <span class="campo-icono">🔒</span>
            </div>
          </div>

          <div class="campo">
            <label for="confirmar">Confirmar contraseña</label>
            <div class="campo-icono-wrap">
              <input
                type="password"
                id="confirmar"
                placeholder="••••••••"
                required
              />
              <span class="campo-icono">🔒</span>
            </div>
          </div>

          <p
            id="error-msg"
            style="
              color: red;
              font-size: 13px;
              margin-top: -10px;
              display: none;
            "
          ></p>

          <button type="submit" class="boton-ingresar" onclick="registrar()">
            Registrarse
          </button>
          <div class="volver">
            <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../js/registro.js"></script>
  </body>
</html>
